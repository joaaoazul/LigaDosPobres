# Postgres para desenvolvimento local. Em produção a base de dados é a do
# serviço alojado, definida pelas variáveis de ambiente.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ligadospobres
      POSTGRES_USER: liga
      POSTGRES_PASSWORD: liga
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liga -d ligadospobres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
