spring.application.name=LigaDosPobres
server.port=${PORT:8080}

# Em desenvolvimento aponta para o Postgres local; em produção as variáveis de
# ambiente substituem estes valores. Credenciais nunca entram neste ficheiro.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ligadospobres}
spring.datasource.username=${DB_USER:liga}
spring.datasource.password=${DB_PASSWORD:}

# O Flyway é dono do esquema. O Hibernate limita-se a verificar que as entidades
# correspondem às tabelas, e recusa arrancar se não corresponderem.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Planos alojados limitam ligações simultâneas.
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}

# Primeiro administrador. Só é usado quando não existe nenhum administrador
# ativo, ou seja, no arranque contra uma base de dados vazia.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Envio de email, usado pela recuperação de password. Sem chave, as mensagens
# vão para o log em vez de serem enviadas — o que serve em desenvolvimento e
# deixa a aplicação arrancar, mas em produção significa que ninguém recupera
# a password. O arranque avisa quando é esse o caso.
email.chave=${EMAIL_CHAVE:}
email.remetente=${EMAIL_REMETENTE:}

# Endereço público da aplicação. Entra no link que vai no email de recuperação,
# por isso apontar isto ao sítio errado manda as pessoas para outro lado.
app.url=${APP_URL:http://localhost:8080}

# Atrás de um proxy (Cloudflare, Caddy, nginx), o pedido chega à aplicação em
# HTTP simples. Sem honrar os cabeçalhos X-Forwarded-*, o Spring julga-se em
# http:// e gera redirecionamentos para http, o que parte o login por trás de
# HTTPS. Só ativar quando há mesmo um proxy à frente.
server.forward-headers-strategy=${FORWARD_HEADERS:none}

# Cookie de sessão: inacessível a JavaScript e, em produção, só sobre HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Só o health fica exposto. Os restantes endpoints do actuator revelam
# configuração e ambiente, e não têm de estar acessíveis.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Um decimal onde se espera um inteiro deixa de ser truncado em silencio.
# Sem isto, "pontuacao": 3.9 ficava gravado como 3, com HTTP 200 e sem aviso:
# a classificacao ficava errada e ninguem tinha por onde dar por isso.
spring.jackson.deserialization.accept-float-as-int=false

# Upload de logos de liga: o controlador valida <= 1 MB; aqui deixa-se folga
# para o pedido multipart não ser cortado antes de lá chegar.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# O Tomcat aborta a ligacao se tiver de engolir mais do que maxSwallowSize
# (2 MB por omissao) depois de recusar um upload. Sem isto, um ficheiro muito
# grande dava um erro de rede em vez do 413 com mensagem.
server.tomcat.max-swallow-size=-1
