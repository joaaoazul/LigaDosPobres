<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite de treinador &middot; Quota</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='none' stroke='%23f0f1f3' stroke-width='2.5' opacity='0.3'/><path d='M16 4a12 12 0 0 1 10.392 6' fill='none' stroke='%23ff5a1f' stroke-width='2.5' stroke-linecap='round'/></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-auth">

<main class="cartao-auth">
    <div class="marca-auth">
        <svg class="emblema" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.28"/><path class="arco" d="M16 4a12 12 0 0 1 10.392 6" fill="none" stroke-width="2.5" stroke-linecap="round"/></svg>
        <h1>Quota</h1>
        <p class="tagline">Convite de treinador</p>
    </div>

    <p id="convite-resumo" class="ajuda">A confirmar o convite&hellip;</p>
    <p id="convite-validade" class="ajuda oculto"></p>

    <div id="alerta" class="alerta oculto" role="alert"></div>

    <!-- Já tem sessão aberta: liga o lugar à conta que já existe, sem criar
         um segundo login. -->
    <form id="form-ligar" class="formulario oculto">
        <button type="submit" class="botao primario">Aceitar com a minha conta</button>
        <span class="ajuda" id="ligar-ajuda"></span>
    </form>

    <!-- Sem sessão: cria a conta e aceita o convite no mesmo passo. -->
    <form id="form-registo" class="formulario oculto">
        <label for="nome">Nome</label>
        <input id="nome" type="text" autocomplete="name" required>

        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" minlength="10" required>
        <span class="ajuda">Pelo menos 10 caracteres.</span>

        <button type="submit" class="botao primario">Criar conta e aceitar</button>
    </form>

    <p id="rodape-login" class="ajuda oculto">
        Já tens conta? <a href="login.html">Entra</a> e volta a abrir este link.
    </p>
</main>

<script src="auth.js"></script>
<script src="convite.js"></script>
</body>
</html>
