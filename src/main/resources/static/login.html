<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar &middot; Liga dos Pobres</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23f0f1f3' stroke-width='2'/><polygon points='16,9 22.66,13.84 20.12,21.66 11.88,21.66 9.34,13.84' fill='%23ff5a1f'/></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-auth">

<main class="cartao-auth">
    <div class="marca-auth">
        <img class="logo-marca" src="/imagens/liga-record.jpg" alt="Liga Record Monte Gordo — Premier League">
        <h1>Quota </h1>
    </div>

    <p class="ajuda">Entra com a tua conta de gestor.</p>

    <div id="alerta" class="alerta oculto" role="alert"></div>

    <form id="form-login" class="formulario">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>

        <button type="submit" class="botao primario">Entrar</button>
    </form>

    <p class="ajuda">Ainda não tens conta? <a href="registo.html">Criar conta</a></p>
</main>

<script src="auth.js"></script>
<script src="login.js"></script>
</body>
</html>
