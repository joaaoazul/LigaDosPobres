<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta de treinador &middot; Quota</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='none' stroke='%23f0f1f3' stroke-width='3'/><path d='M16 4a12 12 0 0 1 10.392 6' fill='none' stroke='%23ff5a1f' stroke-width='3' stroke-linecap='round'/></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-auth">

<main class="cartao-auth">
    <div class="marca-auth">
        <svg class="emblema" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.28"/><path class="arco" d="M16 4a12 12 0 0 1 10.392 6" fill="none" stroke-width="2.5" stroke-linecap="round"/></svg>
        <h1>Quota</h1>
        <p class="tagline">Conta de treinador</p>
    </div>

    <p class="ajuda">
        Cria a tua conta a partir do convite que o gestor da tua equipa te deu.
        Já és gestor de outra liga ou treinas outra equipa? Em vez disto,
        entra na tua conta e liga o convite em Password &rarr; Ligar convite.
    </p>

    <div id="alerta" class="alerta oculto" role="alert"></div>

    <form id="form-registo" class="formulario">
        <label for="codigo">Código do convite</label>
        <input id="codigo" type="text" autocomplete="off" required>

        <label for="nome">Nome</label>
        <input id="nome" type="text" autocomplete="name" required>

        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" minlength="10" required>
        <span class="ajuda">Pelo menos 10 caracteres.</span>

        <button type="submit" class="botao primario">Criar conta</button>
    </form>

    <p class="ajuda">Já tens conta? <a href="login.html">Entrar</a></p>
</main>

<script src="auth.js"></script>
<script src="registo-treinador.js"></script>
</body>
</html>
