<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quota</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='none' stroke='%23f0f1f3' stroke-width='2.5' opacity='0.3'/><path d='M16 4a12 12 0 0 1 10.392 6' fill='none' stroke='%23ff5a1f' stroke-width='2.5' stroke-linecap='round'/></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topo">
    <div class="marca">
        <svg class="emblema" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.28"/><path class="arco" d="M16 4a12 12 0 0 1 10.392 6" fill="none" stroke-width="2.5" stroke-linecap="round"/></svg>
        <div>
            <h1>Quota</h1>
            <p>Gestão de ligas record</p>
        </div>
    </div>

    <div id="barra-sessao" class="sessao oculto">
        <a id="link-admin" href="/admin.html" class="botao pequeno oculto">Administração</a>
        <span id="gestor-nome"></span>
        <a href="/conta.html" class="botao pequeno">Password</a>
        <button id="btn-sair" class="botao pequeno">Sair</button>
    </div>
</header>

<div id="alerta" class="alerta oculto" role="alert"></div>

<main class="conteudo">

    <aside class="painel-lateral">
        <h2>Ligas</h2>

        <form id="form-liga" class="formulario">
            <label for="liga-nome">Nome da liga</label>
            <input id="liga-nome" name="nome" type="text" placeholder="Liga dos Pobres 25/26" required>

            <label for="liga-max">Máximo de equipas</label>
            <input id="liga-max" name="maxEquipas" type="number" min="1" max="45" value="20" required>

            <button type="submit" class="botao primario">Criar liga</button>
        </form>

        <ul id="lista-ligas" class="lista-ligas"></ul>
    </aside>

    <section class="painel-principal">

        <div id="sem-liga" class="vazio">
            <svg class="bola-grande" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.75"/><polygon class="placa" points="16,9 22.66,13.84 20.12,21.66 11.88,21.66 9.34,13.84"/></svg>
            <h2>Nenhuma liga selecionada</h2>
            <p>Cria uma liga ou escolhe uma da lista à esquerda.</p>
        </div>

        <div id="detalhe-liga" class="oculto">

            <div class="cabecalho-liga">
                <div class="identidade-liga">
                    <div class="logo-liga-wrap">
                        <button type="button" id="liga-logo" class="liga-logo" aria-label="Adicionar ou mudar o logo da liga" title="Adicionar ou mudar o logo da liga"></button>
                        <button type="button" id="btn-logo-remover" class="logo-remover oculto" title="Remover logo" aria-label="Remover logo">&times;</button>
                    </div>
                    <div>
                        <h2 id="liga-titulo"></h2>
                        <div id="liga-badges" class="badges"></div>
                    </div>
                </div>
                <button id="btn-terminar" class="botao perigo">Terminar liga</button>
            </div>
            <input type="file" id="input-logo" accept="image/png,image/jpeg,image/webp" hidden>

            <nav class="separadores">
                <button class="separador ativo" data-tab="classificacao">Classificação</button>
                <button class="separador" data-tab="equipas">Equipas</button>
                <button class="separador" data-tab="jornadas">Jornadas</button>
            </nav>

            <section id="tab-classificacao" class="tab">
                <div id="tabela-classificacao"></div>
            </section>

            <section id="tab-equipas" class="tab oculto">
                <form id="form-equipa" class="formulario em-linha">
                    <div>
                        <label for="equipa-nome">Equipa</label>
                        <input id="equipa-nome" type="text" placeholder="Bairro da Caixa FC" required>
                    </div>
                    <div>
                        <label for="equipa-treinador">Treinador</label>
                        <input id="equipa-treinador" type="text" placeholder="João Azul" required>
                    </div>
                    <button type="submit" class="botao primario">Adicionar equipa</button>
                </form>
                <div id="tabela-equipas"></div>
            </section>

            <section id="tab-jornadas" class="tab oculto">
                <div class="barra-acoes">
                    <button id="btn-abrir-jornada" class="botao primario">Abrir jornada</button>
                    <span class="ajuda">As primeiras 5 jornadas são de treino; as seguintes contam como oficiais.</span>
                </div>
                <div class="grelha-jornadas">
                    <div id="lista-jornadas" class="lista-jornadas"></div>
                    <div id="detalhe-jornada" class="detalhe-jornada"></div>
                </div>
            </section>

        </div>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
