<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte &middot; Quota</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='none' stroke='%23f0f1f3' stroke-width='3'/><path d='M16 4a12 12 0 0 1 10.392 6' fill='none' stroke='%23ff5a1f' stroke-width='3' stroke-linecap='round'/></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-auth">

<main class="cartao-auth">
    <div class="marca-auth">
        <svg class="emblema" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.28"/><path class="arco" d="M16 4a12 12 0 0 1 10.392 6" fill="none" stroke-width="2.5" stroke-linecap="round"/></svg>
        <h1>Quota</h1>
        <p class="tagline">Suporte</p>
    </div>

    <p class="ajuda">Escreve o que se passa e respondemos para o email que deixares.
        Se o problema for entrares na conta, diz qual o email da conta.</p>

    <div id="alerta" class="alerta oculto" role="alert"></div>

    <form id="form-suporte" class="formulario">
        <label for="nome">Nome</label>
        <input id="nome" type="text" autocomplete="name" maxlength="120" required>

        <label for="email">O teu email</label>
        <input id="email" type="email" autocomplete="email" maxlength="180" required>

        <label for="assunto">Assunto</label>
        <input id="assunto" type="text" maxlength="120" required
               placeholder="Ex.: não consigo entrar na minha conta">

        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" rows="7" maxlength="4000" required
                  placeholder="Conta o que aconteceu, e o que já tentaste."></textarea>

        <button type="submit" class="botao primario">Enviar mensagem</button>
    </form>

    <p class="ajuda"><a href="login.html">Voltar a entrar</a></p>
</main>

<script src="auth.js"></script>
<script src="suporte.js"></script>
</body>
</html>
